input {
  tcp {
    port => 5000
    codec => json_lines
  }

  beats {
    port => 5044
  }

  stdin {}
}

filter {
  if [message] =~ /^\s*$/ {
    drop {}
  }

  mutate {
    add_field => { "received_at" => "%{@timestamp}" }
  }

  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
