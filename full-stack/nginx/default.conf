upstream backend_api {
    # Replace with your backend service
    # Example: server backend:3000;
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static files or proxy to frontend dev server
    location / {
        # Option 1: Serve static files
        # root /usr/share/nginx/html;
        # index index.html;
        # try_files $uri $uri/ /index.html;

        # Option 2: Proxy to frontend dev server (uncomment and adjust)
        # proxy_pass http://host.docker.internal:5173;

        # Default: return a placeholder
        return 200 '<!DOCTYPE html><html><body><h1>Full Stack Dev Environment</h1><p>Configure nginx/default.conf to serve your frontend.</p></body></html>';
        add_header Content-Type text/html;
    }
}
